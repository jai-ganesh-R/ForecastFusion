services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forecastfusion_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@timescaledb:5432/forecastfusion
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - ENVIRONMENT=production
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  timescaledb:
    image: timescale/timescaledb-ha:pg16-postgis
    container_name: forecastfusion_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=forecastfusion
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: forecastfusion_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  timescale_data:
